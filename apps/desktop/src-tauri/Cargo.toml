[package]
name = "bouml-desktop-host"
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"
description = "Tauri v2 native desktop host bridging BouML Next Rust core engine to React/XYFlow UI"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
bouml-codegen = { path = "../../../crates/bouml-codegen" }
bouml-core = { path = "../../../crates/bouml-core" }
bouml-importers = { path = "../../../crates/bouml-importers" }
bouml-persistence = { path = "../../../crates/bouml-persistence" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
