name: Release BouML v2 Desktop

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_version:
        description: 'Version de release (ex: v2.0.0)'
        required: false
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  test-and-check:
    name: Tests & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & Unit Tests
        run: |
          npm run test
          npm run build

  publish-tauri:
    name: Build Desktop (${{ matrix.platform }})
    needs: test-and-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'ubuntu-22.04'
            args: ''
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux Tauri dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - name: Install frontend dependencies
        run: npm ci

      - name: Build & Upload Tauri Desktop Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version }}
          releaseName: 'BouML v2 (${{ github.ref_type == 'tag' && github.ref_name || inputs.release_version }})'
          releaseBody: |
            ## BouML v2 — Studio UML 2.5, PlantUML & Génération Multi-Langages
            - **Windows** : `.msi` et `.exe` (NSIS)
            - **macOS** : `.dmg` Universal (Apple Silicon + Intel)
            - **Linux** : `.AppImage` et `.deb`

            Aucune dépendance externe requise (ni Java, ni Graphviz).
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
