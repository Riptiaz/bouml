[workspace]
resolver = "2"
members = [
    "crates/bouml-core",
    "crates/bouml-persistence",
    "crates/bouml-codegen",
    "crates/bouml-importers",
    "crates/bouml-ai",
    "crates/bouml-rpc",
    "crates/bouml-cli",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-2.0-or-later"

[workspace.dependencies]
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "2"
ulid = { version = "1", features = ["serde"] }
ureq = { version = "2", features = ["json"] }
clap = { version = "4", features = ["derive"] }
tempfile = "3"
