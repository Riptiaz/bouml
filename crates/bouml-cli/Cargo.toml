[package]
name = "bouml-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Headless CLI for BouML Next (project init, UML validation, legacy .prj migration, CI/CD)"

[[bin]]
name = "bouml"
path = "src/main.rs"

[dependencies]
bouml-ai = { path = "../bouml-ai" }
bouml-codegen = { path = "../bouml-codegen" }
bouml-core = { path = "../bouml-core" }
bouml-importers = { path = "../bouml-importers" }
bouml-persistence = { path = "../bouml-persistence" }
bouml-rpc = { path = "../bouml-rpc" }
clap.workspace = true
serde_json.workspace = true
